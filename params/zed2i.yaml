# params/zed2i.yaml
# Parameters for Stereolabs ZED 2i camera
---

general:
    camera_model:               'zed2i'
    resolution:                 3               # '0': HD2K, '1': HD1080, '3': HD720, '5': VGA, '6': AUTO
    grab_frame_rate:            100             # Frequency of frame grabbing for internal SDK operations

depth:
    min_depth:                  0.2             # Min: 0.2, Max: 3.0 - Default 0.7 - Note: reducing this value wil require more computational power and GPU memory
    max_depth:                  20.0            # Max: 40.0
    # sensing_mode:               1
    quality:                    3               # '0': NONE, '1': PERFORMANCE, '2': QUALITY, '3': ULTRA, '4': NEURAL

# Hand-eye calibration transform from the ZED left-camera coordinate frame to
# the robot base/odom_combined frame. Values are row-major. Update this after
# running camcalib.py and calibdata.py.
track_ball_meancovariance:
    base_to_left: [0.83182232, -0.19390764, -0.52006869, 0.79588413,
                   0.12945255,  0.97892641, -0.15794027, 0.23345217,
                   0.53973480,  0.06405402,  0.83939468, 0.04414754,
                   0.0,         0.0,         0.0,        1.0]
